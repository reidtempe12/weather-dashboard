<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Skyline Forecast</title>
    <link rel="stylesheet" href="main.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  </head>
  <body>
    <div id="dashboard">
      <header id="page-header">
        <div>
          <h1>Skyline Forecast</h1>
        </div>
      </header>
      <!-- hero summary removed per request -->
      <div id="alert" role="alert" aria-live="assertive" class="hidden"></div>
      <div id="annotations" aria-live="polite"></div>
      <div id="forecast" aria-label="7 day forecast" role="region"></div>
      <div id="precip-map" aria-hidden="false">
        <div class="map-caption" aria-hidden="true">Live precipitation map — tap to zoom</div>
        <div class="map-legend" aria-hidden="true">
          <div class="map-legend-item"><span class="swatch swatch-extreme"></span>Extreme</div>
          <div class="map-legend-item"><span class="swatch swatch-heavy"></span>Heavy</div>
          <div class="map-legend-item"><span class="swatch swatch-moderate"></span>Moderate</div>
          <div class="map-legend-item"><span class="swatch swatch-light"></span>Light</div>
        </div>
      </div>
      <div id="status">Initializing…</div>
      <footer id="page-footer">
        <div class="footer-brand">
          <span class="footer-title">Built by Tempa Reid</span>
        </div>
        <div class="footer-copy">© 2026 Skyline Forecast</div>
      </footer>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="main.js"></script>
  </body>
</html>
